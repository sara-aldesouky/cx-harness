services:
  - type: web
    name: cx-harness-benchmark-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic -c alembic.ini upgrade b2aa96d282d0
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://cx-harness-benchmark-dashboard.onrender.com
      - key: AUTHENTICATION_HMAC_SECRET
        sync: false
      - key: SECURITY_AUDIT_PSEUDONYM_KEY
        sync: false

  - type: web
    name: cx-harness-benchmark-dashboard
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /benchmark-reporting
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://cx-harness-benchmark-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_TIMEOUT_MS
        value: 30000
