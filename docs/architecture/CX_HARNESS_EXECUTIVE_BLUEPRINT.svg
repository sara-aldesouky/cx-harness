<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1400" viewBox="0 0 2600 1400" role="img" aria-labelledby="title desc">
  <title id="title">CX Harness Executive Engineering Blueprint</title>
  <desc id="desc">An executive blueprint showing the live request path from user to PostgreSQL and back, protected by isolated testing, with progress and future AI expansion.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#16a34a"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}
      .title{font-size:46px;font-weight:800;letter-spacing:-1px}.subtitle{font-size:18px;font-weight:500;fill:#475569}
      .eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px}.zoneTitle{font-size:14px;font-weight:800;letter-spacing:1.5px;fill:#475569}
      .boxTitle{font-size:19px;font-weight:750}.body{font-size:13px;fill:#475569}.small{font-size:11.5px;fill:#64748b}.tiny{font-size:10px;fill:#64748b}
      .zone{fill:#fff;stroke:#d7e0eb;stroke-width:1.5;filter:url(#shadow)}
      .blue{fill:#f4f8ff;stroke:#3b82f6;stroke-width:1.8}.green{fill:#f1fcf5;stroke:#22c55e;stroke-width:1.8}
      .gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.orange{fill:#fff7ed;stroke:#f97316;stroke-width:1.8}
      .purple{fill:#faf7ff;stroke:#8b5cf6;stroke-width:1.8}.future{fill:#fbfaff;stroke:#8b5cf6;stroke-width:2;stroke-dasharray:10 8}
      .flow{fill:none;stroke:#1d4ed8;stroke-width:7;marker-end:url(#arrowBlue)}.return{fill:none;stroke:#16a34a;stroke-width:5;marker-end:url(#arrowGreen)}
      .support{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrowGray)}.futureFlow{fill:none;stroke:#7c3aed;stroke-width:2.8;marker-end:url(#arrowPurple)}
      .line{stroke:#dbe3ee}.pill{font-size:10px;font-weight:800;letter-spacing:.8px}.flowLabel{font-size:11.5px;font-weight:800;fill:#1d4ed8;letter-spacing:.5px}
    </style>
