[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
markers =
    integration: requires the isolated local PostgreSQL test database
    live_model: explicitly requested test requiring local Ollama model inference
    live_http_model: explicitly requested full HTTP/Ollama/PostgreSQL verification
